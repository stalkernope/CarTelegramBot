<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CAR LEGENDS</title>


<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="game">


<!-- =========================
HEADER
========================= -->


<header class="top">


<div class="logo">

🏎 CAR LEGENDS

</div>


<div class="player">


<div id="username">
PLAYER
</div>


<div>

⭐ LVL

<span id="level">
1
</span>

</div>


</div>


</header>





<!-- =========================
WALLET
========================= -->


<section class="wallet">


<div>

💰

<span id="coins">
0
</span>

</div>



<div>

💎

<span id="gems">
0
</span>

</div>



<div>

🔥 REP

<span id="rep">
0
</span>

</div>


</section>






<!-- =========================
PAGE CONTAINER
========================= -->


<main id="app">


<!-- HOME -->


<section id="home-page" class="page active">


<div class="main-car">


<div class="car-image">


<img id="car-image"
src="assets/cars/default.png">


</div>



<h1 id="main-car">

Нет машины

</h1>



<div class="rarity" id="rarity">

COMMON

</div>





<div class="stats">


<div>

⚡ POWER

<b id="power">
0
</b>

</div>



<div>

🚀 SPEED

<b id="speed">
0
</b>

</div>



<div>

🎯 CONTROL

<b id="control">
0
</b>

</div>


</div>


</div>





<div class="quick-buttons">


<button data-page="garage">

🚗 GARAGE

</button>


<button data-page="race">

🏁 RACE

</button>


<button data-page="shop">

🛒 SHOP

</button>


<button data-page="tuning">

🔧 TUNING

</button>


</div>


</section>






<!-- GARAGE -->


<section id="garage-page" class="page">


<h2>
🚗 GARAGE
</h2>


<div id="garage-list">

</div>


</section>







<!-- SHOP -->


<section id="shop-page" class="page">


<h2>
🛒 SHOP
</h2>


<div id="shop-list">

</div>


</section>







<!-- TUNING -->


<section id="tuning-page" class="page">


<h2>
🔧 TUNING
</h2>


<div id="tuning-list">

</div>


</section>







<!-- RACE -->


<section id="race-page" class="page">


<h2>
🏁 RACE
</h2>


<button id="npc-race">

START RACE

</button>



<button id="boss-race">

BOSS RACE

</button>



<div id="race-result">

</div>


</section>







<!-- PROFILE -->


<section id="profile-page" class="page">


<h2>

👤 PROFILE

</h2>


<div class="profile-card">


<p>
🏆 Wins:
<span id="wins">
0
</span>
</p>


<p>
❌ Losses:
<span id="losses">
0
</span>
</p>


<p>
🚗 Cars:
<span id="cars-count">
0
</span>
</p>


<p>
🐾 Pets:
<span id="pets-count">
0
</span>
</p>


</div>


</section>







<!-- BLACKLIST -->


<section id="blacklist-page" class="page">


<h2>

🏆 BLACKLIST

</h2>


<div id="blacklist-list">

</div>


</section>



</main>






<!-- =========================
BOTTOM MENU
========================= -->


<footer>


<div data-page="home">

🏠
<br>
HOME

</div>



<div data-page="race">

🏁
<br>
RACE

</div>



<div data-page="garage">

🚗
<br>
GARAGE

</div>



<div data-page="shop">

🛒
<br>
SHOP

</div>



<div data-page="profile">

👤
<br>
PROFILE

</div>


</footer>



</div>





<script src="app.js"></script>


</body>

</html>
