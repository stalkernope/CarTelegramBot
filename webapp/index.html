<!DOCTYPE html>

<html lang="ru">


<head>


    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>
        CAR LEGENDS
    </title>


    <!-- Telegram Mini App -->

    <script src="https://telegram.org/js/telegram-web-app.js"></script>


    <link rel="stylesheet" href="style.css">


</head>



<body>



<div class="game">



    <header class="top">


        <div class="logo">

            🏎 CAR LEGENDS

        </div>



        <div class="player">


            <span id="username">

                PLAYER

            </span>


            <br>


            ⭐ Level

            <span id="level">

                1

            </span>


        </div>


    </header>





    <section class="wallet">


        <div>

            💰

            <span id="coins">

                0

            </span>


        </div>



        <div>

            💎

            <span id="gems">

                0

            </span>


        </div>



        <div>

            🔥 REP

            <span id="xp">

                0

            </span>


        </div>



    </section>







    <section class="main-car">



        <div class="car-glow">


            🏎


        </div>



        <h1 id="main-car">


            Нет машины


        </h1>




        <div class="rarity">


            LEGENDARY


        </div>





        <div class="stats">



            <div>

                ⚡ POWER

                <b id="power">

                    0

                </b>


            </div>



            <div>

                🚀 SPEED

                <b id="speed">

                    0

                </b>


            </div>



            <div>

                🎯 CONTROL

                <b id="control">

                    0

                </b>


            </div>



        </div>


    </section>







    <section class="menu">


        <button data-page="race">

            🏁 RACE

        </button>



        <button data-page="garage">

            🚗 GARAGE

        </button>



        <button data-page="tuning">

            🔧 TUNING

        </button>



        <button data-page="blacklist">

            🏆 BLACKLIST

        </button>



        <button data-page="shop">

            🛒 SHOP

        </button>



        <button data-page="profile">

            👤 PROFILE

        </button>



    </section>






    <footer>


        <div>

            🏠

            <br>

            HOME

        </div>



        <div>

            🏁

            <br>

            RACE

        </div>



        <div>

            🚗

            <br>

            GARAGE

        </div>



        <div>

            🛒

            <br>

            SHOP

        </div>



        <div>

            👤

            <br>

            PROFILE

        </div>


    </footer>



</div>





<script src="app.js"></script>



</body>


</html>
